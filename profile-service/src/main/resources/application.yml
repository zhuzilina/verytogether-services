server:
  port: 8084

spring:
  application:
    name: profile-service

  datasource:
    url: jdbc:postgresql://localhost:5433/profiles
    username: postgres
    password: Qwer1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 跨域配置
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8080
    - http://localhost:4200
    - http://localhost:5173
    - http://127.0.0.1:3000
    - http://127.0.0.1:8080
    - http://127.0.0.1:4200
    - http://127.0.0.1:5173
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# JWT 配置
jwt:
  secret: myVeryLongSecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLong
  expiration: 86400

# User Service 配置
user-service:
  url: http://localhost:8082

# 日志配置
logging:
  level:
    root: INFO
    com.example.profileservice: DEBUG
    org.springframework.web: DEBUG
  file:
    name: ./logs/profile-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      clean-history-on-start: true
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"