server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5433/users
    username: postgres
    password: Qwer1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 跨域配置
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8080
    - http://localhost:4200
    - http://localhost:5173
    - http://127.0.0.1:3000
    - http://127.0.0.1:8080
    - http://127.0.0.1:4200
    - http://127.0.0.1:5173
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# 管理员用户配置
admin:
  username: admin
  password: admin123
  email: admin@system.local
  fullName: System Administrator
  role: SUPER_ADMIN

# Profile Service 配置
profile-service:
  url: http://localhost:8084

# 日志配置
logging:
  level:
    root: INFO
    org.verytogether.userservice: DEBUG
    org.springframework.web: DEBUG
  file:
    name: ./logs/user-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      clean-history-on-start: true
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"